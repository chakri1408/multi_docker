name: Deploy MultiDocker

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t chakri1408/react-test -f ./client/Dockerfile.dev ./client

      - name: Run tests
        run: docker run -e CI=true chakri1408/react-test npm test

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build production images
        run: |
          docker build -t chakri1408/multi-client ./client
          docker build -t chakri1408/multi-nginx ./ngnix
          docker build -t chakri1408/multi-server ./server
          docker build -t chakri1408/multi-worker ./worker

      - name: Push images to Docker Hub
        run: |
          docker push chakri1408/multi-client
          docker push chakri1408/multi-nginx
          docker push chakri1408/multi-server
          docker push chakri1408/multi-worker

      - name: Generate deployment package
        run: zip -r deploy.zip . -x '*.git*'

      - name: Deploy to AWS Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: "multi-docker"
          environment_name: "Multi-Docker-env"
          region: "eu-north-1"
          version_label: ${{ github.sha }}
          deployment_package: deploy.zip
          use_existing_version_if_available: true
